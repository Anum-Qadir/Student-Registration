
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Position and Layout</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Position and Layout</h1>

    <!-- Task 1: Relative and Absolute Position -->
    <h2>1. Position Property</h2>

    <div class="box">
        <span class="badge">NEW</span>
        <h3>My Product</h3>
        <p>This is my product box.</p>
    </div>

    <!-- Optional Task: Flexbox -->
    <h2>2. Flexbox Layout</h2>

    <div class="flex-container">
        <div class="flex-box">Box 1</div>
        <div class="flex-box">Box 2</div>
        <div class="flex-box">Box 3</div>
    </div>

    <!-- Optional Task: Grid -->
    <h2>3. Grid Layout</h2>

    <div class="grid-container">
        <div class="grid-box">Box 1</div>
        <div class="grid-box">Box 2</div>
        <div class="grid-box">Box 3</div>
        <div class="grid-box">Box 4</div>
        <div class="grid-box">Box 5</div>
        <div class="grid-box">Box 6</div>
    </div>

</body>
</html>
